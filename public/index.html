<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Remote Terminal</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="/app.css">
  <script type="importmap">
  {
    "imports": {
      "@xterm/xterm": "/vendor/xterm/lib/xterm.mjs",
      "@xterm/addon-fit": "/vendor/addon-fit/lib/addon-fit.mjs",
      "@xterm/addon-webgl": "/vendor/addon-webgl/lib/addon-webgl.mjs",
      "@xterm/addon-web-links": "/vendor/addon-web-links/lib/addon-web-links.mjs",
      "@xterm/addon-unicode11": "/vendor/addon-unicode11/lib/addon-unicode11.mjs"
    }
  }
  </script>
</head>
<body>
  <!-- Home: running instances + commands -->
  <section id="home" class="screen" hidden>
    <div class="card home-card">
      <div class="home-head">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7 5 5-5 5"/><path d="M13 17h6"/></svg>
        </div>
        <h1>Remote Terminal</h1>
        <button type="button" id="home-close" class="ghost-icon" aria-label="Back to terminal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="sub" id="home-note"></p>
      <p class="upgrade" id="home-upgrade" hidden>This server is running an older version. Restart <code>remote-terminal-server</code> to rename terminals and get folder suggestions. (Restarting ends the terminals running in it.)</p>

      <h2>Running</h2>
      <div id="instance-list" class="session-list"></div>

      <h2>Start</h2>
      <div class="cwd-wrap">
        <label class="cwd-field">
          <span>in</span>
          <input id="cwd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="~"
                 role="combobox" aria-autocomplete="list" aria-controls="cwd-list" aria-expanded="false">
          <button type="button" id="cwd-browse" class="ghost-icon" aria-label="Browse folders" title="Browse folders">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
          </button>
        </label>
        <!-- Folders matching what's typed -->
        <div id="cwd-list" class="cwd-list" role="listbox" hidden></div>
      </div>
      <div id="command-list" class="commands"></div>
      <p class="error" id="home-error" role="alert"></p>

      <h2 class="home-files-h">Files</h2>
      <button id="home-files" class="files-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
        <span class="s-main"><b>Shared scratch</b><small id="home-files-path"></small></span>
      </button>
    </div>
  </section>

  <!-- Files: the shared scratch area, one folder per terminal -->
  <section id="files" class="screen overlay" hidden aria-label="Files">
    <div class="card files-panel">
      <div class="files-head">
        <button id="files-up" class="ghost-icon" aria-label="Up">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="files-title"><b id="files-name">Files</b><small id="files-path"></small></div>
        <button id="files-close" class="ghost-icon" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="files-actions">
        <label class="chip upload">Upload<input id="files-input" type="file" multiple hidden></label>
        <button id="files-copy" class="chip ghost">Copy path</button>
      </div>
      <div id="files-list" class="files-list"></div>
      <p class="error" id="files-error" role="alert"></p>
    </div>
  </section>

  <!-- Folder browser for "start in" -->
  <section id="picker" class="screen overlay" hidden aria-label="Choose a folder">
    <div class="card files-panel">
      <div class="files-head">
        <button id="picker-up" class="ghost-icon" aria-label="Up">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="files-title"><b id="picker-name">Choose a folder</b><small id="picker-path"></small></div>
        <button id="picker-close" class="ghost-icon" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <label class="cwd-field picker-filter">
        <span>filter</span>
        <input id="picker-filter" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <div id="picker-list" class="files-list"></div>
      <button id="picker-use" class="chip upload picker-use">Use this folder</button>
    </div>
  </section>

  <!-- Terminal -->
  <main id="termview" class="screen" hidden>
    <div id="stage">
      <div id="term">
        <!-- Touch selection: handles at both ends, and a bar to copy -->
        <div id="sel-start" class="sel-handle start" hidden></div>
        <div id="sel-end" class="sel-handle end" hidden></div>
        <div id="sel-bar" class="sel-bar" hidden>
          <button id="sel-copy">Copy</button>
          <button id="sel-all">Select all</button>
        </div>
      </div>

      <div id="banner" class="banner" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="banner-text">Connecting…</span>
      </div>

      <div id="hud">
        <button id="status" class="pill" aria-haspopup="menu" aria-expanded="false">
          <span class="dot" data-state="off"></span>
          <span id="status-text">offline</span>
        </button>
        <div id="menu" class="menu" hidden>
          <!-- This terminal: what runs in it, where, and its scratch folder -->
          <div class="menu-head">
            <div class="mh-title">
              <span id="mh-name" class="mh-name"><b id="mh-program"></b><button class="mini" data-act="rename" aria-label="Rename this terminal">Rename</button></span>
              <span id="mh-viewers"></span>
            </div>
            <div id="mh-where" class="mh-where"></div>
            <div class="mh-scratch">
              <span>scratch</span><code id="mh-scratch"></code>
              <button class="mini" data-act="copy-scratch">Copy path</button>
              <button class="mini" data-act="files">Files</button>
            </div>
          </div>
          <div class="tabs" role="tablist">
            <button role="tab" data-tab="terms" aria-selected="true">Terminals</button>
            <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
          </div>
          <div class="tab-panel" data-panel="terms" role="tabpanel">
            <div id="menu-terms" class="menu-terms"></div>
            <button class="menu-item" data-act="home">New terminal…</button>
          </div>
          <div class="tab-panel" data-panel="settings" role="tabpanel" hidden>
            <div class="menu-row">
              <span>Font size</span>
              <div class="stepper">
                <button data-act="font-" aria-label="Smaller">−</button>
                <output id="font-size">14</output>
                <button data-act="font+" aria-label="Larger">+</button>
              </div>
            </div>
            <button class="menu-item" data-act="home">Home</button>
            <button class="menu-item" data-act="keys">Show key bar <span class="switch" id="keys-switch"></span></button>
            <button class="menu-item" data-act="fullscreen" id="fs-item">Fullscreen</button>
            <button class="menu-item" data-act="copy">Copy text…</button>
            <button class="menu-item" data-act="paste">Paste</button>
            <button class="menu-item" data-act="redraw">Redraw screen</button>
          </div>
        </div>
      </div>

      <button id="fab" class="fab" aria-label="Compose input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>

    <nav id="keybar" aria-label="Special keys">
      <div class="keys">
        <button data-action="copy">copy</button>
        <button data-action="paste">paste</button>
        <button data-key="esc">esc</button>
        <button data-key="tab">tab</button>
        <button data-key="stab">⇧tab</button>
        <button data-key="ctrlc" class="warn">^C</button>
        <button data-key="up" aria-label="Up">↑</button>
        <button data-key="down" aria-label="Down">↓</button>
        <button data-key="left" aria-label="Left">←</button>
        <button data-key="right" aria-label="Right">→</button>
        <button data-key="enter" aria-label="Enter">⏎</button>
        <button data-key="ctrld">^D</button>
        <button data-key="ctrll">^L</button>
        <button data-key="pgup">pgup</button>
        <button data-key="pgdn">pgdn</button>
      </div>
      <button id="kbd" class="kbd" aria-label="Type directly" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
      </button>
    </nav>

    <!-- Copy: the terminal's text in a plain, natively selectable view -->
    <section id="copyview" hidden aria-label="Copy text">
      <div class="copy-bar">
        <span class="copy-title">Select text to copy</span>
        <button id="copy-all" class="chip">Copy all</button>
        <button id="copy-close" class="ghost-icon" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <pre id="copy-text"></pre>
    </section>
    <div id="toast" role="status" hidden></div>

    <!-- Compose sheet -->
    <div id="scrim" hidden></div>
    <section id="sheet" aria-label="Compose" aria-hidden="true">
      <div class="grip" aria-hidden="true"></div>
      <textarea id="compose" rows="1" placeholder="Type or dictate…" autocapitalize="sentences" autocomplete="off" spellcheck="true"></textarea>
      <div class="sheet-bar">
        <button id="mic" class="round" aria-label="Dictate" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
        </button>
        <label class="toggle">
          <input type="checkbox" id="auto-enter" checked>
          <span class="track"><span class="thumb"></span></span>
          <span>Press enter</span>
        </label>
        <span class="spacer"></span>
        <button id="send" class="primary send" aria-label="Send">
          <span>Send</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
